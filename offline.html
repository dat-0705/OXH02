<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1B547C">
  <title>DELTA-V · Mất kết nối</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1B547C; color: #fff; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; }
    .box { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; }
    img { width: 96px; height: 96px; border-radius: 22px; margin-bottom: 20px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { margin: 0 0 24px; opacity: .85; line-height: 1.5; }
    button { background: #fff; color: #1B547C; border: 0; border-radius: 10px; padding: 12px 28px; font-weight: 700; font-size: 15px; }
  </style>
</head>
<body>
  <div class="box">
    <img src="icons/icon-192.png" alt="">
    <h1>Không có kết nối mạng</h1>
    <p>Báo cáo lấy số trực tiếp từ Google Sheets nên cần có mạng.<br>Kiểm tra wifi hoặc 4G rồi thử lại.</p>
    <button onclick="location.href='./'">Thử lại</button>
  </div>
</body>
</html>
