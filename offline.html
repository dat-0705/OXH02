<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">

    p { margin: 0 0 24px; color: #475569; line-height: 1.5; }
    button { background: #005977; color: #fff; border: 0; border-radius: 10px; padding: 12px 28px; font-weight: 700; font-size: 15px; }
  </style>
</head>
<body>
  <div class="box">
    <img src="icons/logo.png" alt="DELTA-V">
    <h1>Không có kết nối mạng</h1>
    <p>Báo cáo lấy số trực tiếp từ Google Sheets nên cần có mạng.<br>Kiểm tra wifi hoặc 4G rồi thử lại.</p>
    <button onclick="location.href='./'">Thử lại</button>
  </div>
</body>
</html>
