<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DELTA-V · OXH02</title>
  <meta name="description" content="Báo cáo quản trị dự án Khu nhà ở xã hội OXH02">
  <meta name="theme-color" content="#1B547C">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <!-- iPhone: mở toàn màn hình khi thêm vào màn hình chính -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DELTA-V">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <style>
    html, body { margin: 0; height: 100%; background: #1B547C; overflow: hidden; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; }
    /* chừa phần tai thỏ / thanh trạng thái iPhone */
    body { padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); box-sizing: border-box; }
    #app { display: block; width: 100%; height: 100%; border: 0; background: #f8fafc; }
    #splash { position: fixed; inset: 0; background: #1B547C; color: #fff; display: flex; flex-direction: column;
              align-items: center; justify-content: center; z-index: 10; transition: opacity .25s; }
    #splash.hide { opacity: 0; pointer-events: none; }
    #splash img { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
    #splash .name { margin-top: 18px; font-weight: 800; letter-spacing: .2em; font-size: 20px; }
    #splash .sub { margin-top: 6px; font-size: 12px; opacity: .8; letter-spacing: .05em; }
    #splash .spin { margin-top: 28px; width: 28px; height: 28px; border: 3px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: s 0.9s linear infinite; }
    #splash .msg { margin-top: 14px; font-size: 13px; opacity: .85; min-height: 18px; text-align: center; padding: 0 24px; }
    @keyframes s { to { transform: rotate(360deg); } }
    #net { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: #ef4444; color: #fff; text-align: center;
           font-size: 13px; font-weight: 600; padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); display: none; }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/icon-192.png" alt="">
    <div class="name">DELTA-V</div>
    <div class="sub">KHU NHÀ Ở XÃ HỘI OXH02</div>
    <div class="spin"></div>
    <div class="msg" id="splash-msg">Đang mở báo cáo...</div>
  </div>
  <iframe id="app" title="Báo cáo DELTA-V" allow="clipboard-write"></iframe>
  <div id="net">Mất kết nối mạng — báo cáo sẽ tự tải lại khi có mạng</div>

  <script src="config.js"></script>
  <script>
    (function () {
      const cfg = window.DV_CONFIG || {};
      const BASE = String(cfg.WEBAPP_URL || '').trim();
      const frame = document.getElementById('app');
      const splash = document.getElementById('splash');
      const msg = document.getElementById('splash-msg');
      const net = document.getElementById('net');

      if (!BASE) {
        splash.querySelector('.spin').style.display = 'none';
        msg.innerHTML = 'Chưa cấu hình link webapp.<br>Điền WEBAPP_URL trong file config.js.';
        return;
      }

      // Chỉ cho phép mở đúng webapp của dự án (cùng mã script trong link /macros/s/<ID>/)
      const m = BASE.match(/\/s\/([^/]+)\//);
      const SCRIPT_ID = m ? m[1] : null;
      const allowed = (u) => {
        try {
          const x = new URL(u);
          return x.hostname === 'script.google.com' && (!SCRIPT_ID || x.pathname.indexOf('/s/' + SCRIPT_ID + '/') >= 0);
        } catch (e) { return false; }
      };

      let hideTimer = null;
      function open(url) {
        splash.classList.remove('hide');
        msg.textContent = 'Đang mở báo cáo...';
        frame.src = url;
        clearTimeout(hideTimer);
        hideTimer = setTimeout(() => { msg.textContent = 'Kết nối chậm, vẫn đang tải...'; }, 8000);
      }
      frame.addEventListener('load', () => { clearTimeout(hideTimer); splash.classList.add('hide'); });

      // Báo cáo trong khung xin đổi trang -> trả lời "đã nhận" rồi đổi trang ngay trong app
      window.addEventListener('message', (ev) => {
        const d = ev.data;
        if (!d || d.type !== 'dv-nav') return;
        if (!/\.googleusercontent\.com$/.test(new URL(ev.origin).hostname)) return;
        if (!allowed(d.url)) return;
        try { ev.source.postMessage({ type: 'dv-ack' }, ev.origin); } catch (e) {}
        open(d.url);
      });

      // Mất mạng / có mạng lại
      function netState() { net.style.display = navigator.onLine ? 'none' : 'block'; }
      window.addEventListener('offline', netState);
      window.addEventListener('online', () => { netState(); if (frame.src) frame.src = frame.src; });
      netState();

      open(BASE);

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
      }
    })();
  </script>
</body>
</html>
